name: Urgent alert -> Telegram

# On-demand only (no schedule) -- dispatched by the opencode project's /watch-portfolio
# monitoring loop the moment it detects a volume/price anomaly on a holding
# (`gh workflow run urgent-alert.yml -f message="..."`). Deliberately does NOT reuse
# kr-watchlist-news.yml's job (Claude Code + WebSearch per stock) -- that takes minutes and costs
# LLM tokens on this repo's own budget; an urgent alert just needs telegram_client.py's existing
# sendMessage call, which is a single REST round trip.
on:
  workflow_dispatch:
    inputs:
      message:
        description: '텔레그램으로 보낼 메시지 텍스트 (4096자 제한, 초과분은 자동 트림됨)'
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/send_urgent_alert.py
        env:
          ALERT_MESSAGE: ${{ github.event.inputs.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
