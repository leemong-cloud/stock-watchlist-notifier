name: KR watchlist news -> KakaoTalk

on:
  schedule:
    - cron: '20 21 * * *'  # 21:20 UTC = 06:20 KST (next calendar day) -- ~7min WebSearch pass lands before 06:30
  workflow_dispatch:
    inputs:
      test_date:
        description: '테스트용 기준 날짜(KST, YYYY-MM-DD) -- 비워두면 실제 실행 시각 사용'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/notify_kr_watchlist.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          TEST_DATE_KST: ${{ github.event.inputs.test_date }}
