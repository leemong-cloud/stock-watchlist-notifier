name: KR watchlist news -> KakaoTalk

on:
  schedule:
    - cron: '50 20 * * *'  # 20:50 UTC = 05:50 KST (next calendar day) -- moved earlier from 06:20
                            # and off a round minute; GH Actions `schedule` queuing delayed the
                            # first live run by ~95min (2026-09-06 -> landed 07:55 KST instead of
                            # 06:20), so this buys margin but isn't a guarantee -- see README. The
                            # run itself (sonnet WebSearch x8 stocks) now takes longer than the old
                            # ~7min haiku pass, so don't shave this buffer down further.
  workflow_dispatch:
    inputs:
      test_date:
        description: '테스트용 기준 날짜(KST, YYYY-MM-DD) -- 비워두면 실제 실행 시각 사용'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/notify_kr_watchlist.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          TEST_DATE_KST: ${{ github.event.inputs.test_date }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
